# Release stock held by abandoned checkouts.
#
# Why this exists instead of a Vercel cron: Hobby accounts are capped at one
# cron run per day, and an expression that would run more often fails the
# deployment outright. Reservations expire after RESERVATION_TTL_MINUTES (15 by
# default), so a daily sweep would leave stock locked for up to 24 hours and the
# shop showing sold out.
#
# The Vercel cron in vercel.json stays as a once-a-day backstop; this is the
# real sweeper. Actions minutes are free and unmetered on public repositories.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CRON_SECRET  - must equal the CRON_SECRET in the Vercel environment
#   APP_URL      - deployment origin, e.g. https://shopmira.vercel.app

name: Release expired reservations

on:
  schedule:
    # Every 5 minutes. GitHub may delay runs when the shared queue is busy, so
    # treat this as best effort — correctness does not depend on exact timing.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# A slow sweep must not pile up behind itself.
concurrency:
  group: release-reservations
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the sweep endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must both be set."
            exit 1
          fi

          # --fail-with-body so a 401 or 500 fails the run and still prints why.
          curl --silent --show-error --fail-with-body \
               --max-time 60 \
               --retry 2 --retry-delay 5 \
               -H "Authorization: Bearer $CRON_SECRET" \
               "$APP_URL/api/cron/release-reservations"
